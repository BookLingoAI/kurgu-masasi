<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurgu Kurulu</title>
<style>
  :root { --bg: #05060b; --ink: #e8ecf6; --muted: #8a93a8; --line: #1d2233; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 16px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0 0 128px 0; display: flex; align-items: center; justify-content: center; }
  svg#room { width: 100%; height: 100%; }
  #top { position: fixed; top: 14px; left: 20px; right: 20px; display: flex; justify-content: space-between;
         font-size: 14px; color: var(--muted); letter-spacing: .04em; pointer-events: none; }
  #top b { color: var(--ink); font-weight: 600; }
  #say { position: fixed; left: 0; right: 0; bottom: 0; height: 128px; padding: 18px 32px;
         background: linear-gradient(#05060b00, #05060bf2 30%); display: flex; gap: 18px; align-items: flex-start; }
  #say .who { flex: 0 0 auto; min-width: 150px; font-weight: 700; font-size: 18px; text-shadow: 0 0 12px currentColor; }
  #say .who small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); text-shadow: none; }
  #say .text { font-size: 21px; max-width: 1100px; }
  #say .text .rest { opacity: .28; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #05060bcc;
           z-index: 5; flex-direction: column; gap: 14px; }
  #start button { font: inherit; font-size: 18px; padding: 14px 28px; border-radius: 999px; border: 1px solid #3d7bff;
                  background: #0b1430; color: var(--ink); cursor: pointer; box-shadow: 0 0 24px #3d7bff66; }
  #start p { color: var(--muted); margin: 0; font-size: 14px; }
  .plate text { font: 600 22px "Segoe UI", system-ui, sans-serif; letter-spacing: .02em; }
  #mic { cursor: pointer; }
  #mic:focus { outline: none; }
  #mic:focus-visible .ring { stroke-width: 5; }
  #pick { display: flex; flex-direction: column; gap: 10px; min-width: 320px; }
  #pick select { font: inherit; padding: 10px 12px; border-radius: 10px; background: #0b0e19; color: var(--ink); border: 1px solid #2a3150; }
  #typebox[hidden] { display: none; }
  #typebox { position: fixed; right: 20px; bottom: 16px; display: flex; gap: 8px; }
  #typebox input { font: inherit; width: 260px; padding: 8px 12px; border-radius: 999px; border: 1px solid #2a3150;
                   background: #0b0e19cc; color: var(--ink); }
  #err { color: #ff8a95; font-size: 14px; max-width: 480px; text-align: center; }
  #kbtn { position: fixed; top: 10px; right: 160px; font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px;
          border: 1px solid #2a3150; background: #0b0e19; color: var(--ink); cursor: pointer; }
  #panel { position: fixed; top: 44px; right: 16px; bottom: 140px; width: min(420px, 92vw); overflow-y: auto; z-index: 4;
           background: #0a0d18f2; border: 1px solid #2a3150; border-radius: 14px; padding: 14px; }
  #panel[hidden] { display: none; }
  #profbox { position: fixed; top: 9px; right: 260px; font-size: 13px; color: var(--muted); }
  #profbox[hidden] { display: none; }
  #profbox select { font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 999px; background: #0b0e19;
                    color: var(--ink); border: 1px solid #2a3150; }
  #profbox.ask select { border-color: #ffa31a; box-shadow: 0 0 14px #ffa31a88; }
  #panel h2 { font-size: 16px; margin: 0 0 4px; }
  #panel .item { border-top: 1px solid #1d2233; padding: 10px 0; font-size: 14px; }
  #panel .item b { display: block; font-size: 15px; }
  #panel .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
  #panel .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  #panel button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid #2a3150;
                  background: #111628; color: var(--ink); cursor: pointer; }
  #panel button:disabled { opacity: .4; cursor: default; }
  #panel .ok { color: #48e08a; } #panel .no { color: #ff6b7a; } #panel .note { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { .robot * { transition: none !important; } }
  #dbtn { position: fixed; top: 10px; left: 16px; font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px;
          border: 1px solid #2a3150; background: #0b0e19; color: var(--ink); cursor: pointer; z-index: 5; }
  #devpanel { position: fixed; top: 44px; left: 16px; width: min(360px, 92vw); z-index: 5; display: flex; flex-direction: column;
              gap: 10px; background: #0a0d18f2; border: 1px solid #2a3150; border-radius: 14px; padding: 14px; font-size: 14px; }
  #devpanel[hidden] { display: none; }
  #devpanel select, #devpanel button { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; background: #0b0e19;
                                       color: var(--ink); border: 1px solid #2a3150; }
  #devpanel button { cursor: pointer; }
  #miclevel { height: 8px; border-radius: 4px; background: #1a2036; overflow: hidden; }
  #miclevel i { display: block; height: 100%; width: 0; background: #46e5b7; transition: width .08s; }
  #devnote { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="top"><span>KURGU KURULU · <b id="proj">—</b></span><span id="phase">hazır</span></div>
<div id="stage">
<svg id="room" viewBox="0 0 1600 860" aria-label="Kurgu Kurulu toplantı masası">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="floor" cx="50%" cy="62%" r="65%">
      <stop offset="0" stop-color="#121624"/><stop offset=".6" stop-color="#080a12"/><stop offset="1" stop-color="#05060b"/>
    </radialGradient>
    <linearGradient id="tabletop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14182a"/><stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2033"/><stop offset=".55" stop-color="#0c0f1b"/><stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#07080e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="860" fill="url(#floor)"/>
  <path d="M0 140 L380 40 M1600 140 L1220 40" stroke="#d6a34a" stroke-opacity=".25" stroke-width="2"/>
  <g id="robots"></g>
  <!-- table in front of the robots' bodies -->
  <ellipse cx="800" cy="676" rx="640" ry="176" fill="#000" opacity=".55" filter="url(#softglow)"/>
  <ellipse cx="800" cy="660" rx="630" ry="160" fill="url(#tabletop)" stroke="#e9eefc" stroke-opacity=".55" stroke-width="2.5"/>
  <ellipse cx="800" cy="660" rx="630" ry="160" fill="none" stroke="#9fb4ff" stroke-opacity=".18" stroke-width="10" filter="url(#glow)"/>
  <g id="plates"></g>
  <!-- the microphone in the middle: press to talk to the board -->
  <g id="mic" role="button" tabindex="0" aria-label="Mikrofon: kurula konuş" transform="translate(800 690) scale(1.25)">
    <ellipse cx="0" cy="34" rx="70" ry="20" fill="#000" opacity=".6"/>
    <ellipse class="ring" cx="0" cy="30" rx="58" ry="16" fill="none" stroke="#3d9bff" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="0" cy="28" rx="44" ry="12" fill="#0c0f1b" stroke="#2a3150"/>
    <rect x="-7" y="-36" width="14" height="64" rx="5" fill="#141826" stroke="#2a3150"/>
    <rect x="-20" y="-96" width="40" height="66" rx="20" fill="#11141f" stroke="#3a4260" stroke-width="2"/>
    <path d="M-20 -78 h40 M-20 -66 h40 M-20 -54 h40 M-20 -42 h40" stroke="#2b3250" stroke-width="2"/>
    <rect class="micband" x="-21" y="-38" width="42" height="7" rx="3" fill="#3d9bff" filter="url(#glow)"/>
    <g class="waves" fill="none" stroke="#3d9bff" stroke-width="3" opacity="0">
      <path d="M-42 -80 q-14 18 0 36"/><path d="M42 -80 q14 18 0 36"/>
      <path d="M-58 -88 q-20 26 0 52"/><path d="M58 -88 q20 26 0 52"/>
    </g>
  </g>
</svg>
</div>
<div id="say"><div class="who" id="who"></div><div class="text" id="text"></div></div>
<div id="start"><div id="pick" hidden><label for="proj-sel">Hangi videoyu konuşalım?</label><select id="proj-sel"></select></div>
<button id="go">Toplantıya katıl</button><p id="startnote">Sesleri duyabilmen için bir kez tıklaman gerekiyor.</p><p id="err"></p></div>
<button id="dbtn" aria-controls="devpanel" aria-expanded="false">🎧 Ses aygıtları</button>
<section id="devpanel" hidden aria-label="Ses aygıtları">
  <label>Mikrofon (konuşacağın aygıt)<br><select id="micsel"></select></label>
  <div id="miclevel" title="Mikrofon seviyesi"><i></i></div>
  <label>Ajanları duyacağın aygıt (hoparlör / kulaklık)<br><select id="outsel"></select></label>
  <button id="outtest" type="button">Sesi dene</button>
  <p id="devnote"></p>
</section>
<button id="kbtn" hidden aria-controls="panel" aria-expanded="false">Kararlar</button>
<label id="profbox" hidden>Tür <select id="profsel" aria-label="Video türü"></select></label>
<aside id="panel" hidden aria-label="Kurulun kararları"></aside>
<form id="typebox" hidden><input id="typein" placeholder="Kurula yaz… (Enter)" aria-label="Kurula yaz"></form>

<script>
"use strict";
// ---- the board -------------------------------------------------------------------------------------------------
const AGENTS = [
  {id: "hikaye",    name: "Derya",  role: "Hikâye ve İzleyici", color: "#c45cff", x: 215,  y: 455, s: 1.06, accent: "flower",
   icon: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>'},
  {id: "grafik",    name: "Zeynep", role: "Baş Editör · Grafik",             color: "#3d7bff", x: 460,  y: 385, s: 0.96, accent: "flower",
   icon: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>'},
  {id: "animasyon", name: "Selin",  role: "Animasyon",          color: "#ffa31a", x: 690,  y: 345, s: 0.9, accent: "bun",
   icon: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>'},
  {id: "gecis",     name: "Can",    role: "Geçiş · Premiere Teknik",     color: "#21d07a", x: 910,  y: 345, s: 0.9, accent: "fin",
   icon: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>'},
  {id: "ses",       name: "Emre",   role: "Ses Mix-Master",     color: "#28c8ff", x: 1140, y: 385, s: 0.96, accent: "phones",
   icon: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'},
  {id: "renk",      name: "Mert",   role: "Eleştirel Denetçi · Görüntü",    color: "#ff3b4e", x: 1385, y: 455, s: 1.06, accent: "crest",
   icon: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'},
];
const HAKEM = {id: "hakem", name: "Hakem", role: "Kurulun kararı", color: "#e9eefc"};
const USER = {id: "sen", name: "Sen", role: "Yönetmen", color: "#ffffff"};
const byId = Object.fromEntries(AGENTS.map(a => [a.id, a]));
const CAMERA_X = 800;      // where "looking at the user" points (the user sits where the camera is)

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, html) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}

// ---- drawing one robot (origin = neck; the head turns and nods around it) -------------------------------------
function drawRobot(a) {
  const outer = el("g", {class: "robot", transform: `translate(${a.x} ${a.y}) scale(${a.s})`}, document.getElementById("robots"));
  const g = el("g", {class: "bob"}, outer);         // breathing moves this one, the outer one keeps the seat
  // chair back
  el("path", {d: "M-108 -30 Q-116 -140 0 -156 Q116 -140 108 -30 L100 200 L-100 200 Z", fill: "url(#seat)",
              stroke: "#262b40", "stroke-width": 2}, g);
  const body = el("g", {class: "body"}, g);
  el("path", {d: "M-96 34 Q-104 10 -70 2 L70 2 Q104 10 96 34 L112 220 L-112 220 Z", fill: "url(#shell)",
              stroke: a.color, "stroke-opacity": .75, "stroke-width": 2.5}, body);
  el("path", {d: "M-96 34 L-112 220 M96 34 L112 220", stroke: a.color, "stroke-width": 3, filter: "url(#glow)", opacity: .55}, body);
  // shoulder lights + chest emblem
  el("circle", {cx: -82, cy: 46, r: 9, fill: a.color, opacity: .5, filter: "url(#glow)"}, body);
  el("circle", {cx: 82, cy: 46, r: 9, fill: a.color, opacity: .5, filter: "url(#glow)"}, body);
  const chest = el("g", {transform: "translate(-21 70) scale(1.75)", fill: "none", stroke: a.color, "stroke-width": 1.8,
                         "stroke-linecap": "round", "stroke-linejoin": "round", filter: "url(#glow)", class: "chest"}, body, a.icon);
  // head
  const head = el("g", {class: "head"}, g);
  el("rect", {x: -14, y: -14, width: 28, height: 22, rx: 6, fill: "#0b0d16", stroke: "#262b40"}, head);   // neck
  const skull = el("g", {class: "skull"}, head);
  if (a.accent === "phones" || a.accent === "flower" || a.accent === "bun") {
    el("rect", {x: -96, y: -112, width: 26, height: 62, rx: 12, fill: "#10131f", stroke: a.color, "stroke-width": 2.5}, skull);
    el("rect", {x: 70, y: -112, width: 26, height: 62, rx: 12, fill: "#10131f", stroke: a.color, "stroke-width": 2.5}, skull);
    el("circle", {cx: -83, cy: -81, r: 8, fill: a.color, filter: "url(#glow)", class: "earlight"}, skull);
    el("circle", {cx: 83, cy: -81, r: 8, fill: a.color, filter: "url(#glow)", class: "earlight"}, skull);
  }
  el("path", {d: "M-78 -70 Q-84 -168 0 -170 Q84 -168 78 -70 Q76 -22 0 -18 Q-76 -22 -78 -70 Z", fill: "url(#shell)",
              stroke: a.color, "stroke-opacity": .8, "stroke-width": 3}, skull);
  el("path", {d: "M-50 -150 Q0 -168 50 -150", stroke: "#ffffff", "stroke-opacity": .18, "stroke-width": 6,
              fill: "none", "stroke-linecap": "round"}, skull);                                              // shine
  if (a.accent === "flower") {
    const f = el("g", {transform: "translate(52 -142)", fill: a.color, filter: "url(#glow)"}, skull);
    for (let i = 0; i < 5; i++) el("ellipse", {cx: 0, cy: -9, rx: 5, ry: 9, transform: `rotate(${i * 72})`, opacity: .9}, f);
    el("circle", {cx: 0, cy: 0, r: 4, fill: "#fff"}, f);
  } else if (a.accent === "bun") {
    el("circle", {cx: 0, cy: -176, r: 18, fill: "url(#shell)", stroke: a.color, "stroke-width": 3}, skull);
  } else if (a.accent === "fin") {
    el("path", {d: "M-10 -168 L0 -196 L10 -168", fill: "#10131f", stroke: a.color, "stroke-width": 3}, skull);
  } else if (a.accent === "crest") {
    el("path", {d: "M-36 -160 L0 -186 L36 -160", fill: "none", stroke: a.color, "stroke-width": 4, filter: "url(#glow)"}, skull);
  }
  // face: visor, eyes, neon mouth
  const face = el("g", {class: "face"}, skull);
  el("path", {d: "M-58 -118 Q0 -132 58 -118 L54 -52 Q0 -40 -54 -52 Z", fill: "#03040a", stroke: a.color, "stroke-opacity": .35,
              "stroke-width": 2}, face);
  const eyes = el("g", {class: "eyes", fill: a.color, filter: "url(#glow)"}, face);
  const eL = el("rect", {x: -32, y: -100, width: 22, height: 10, rx: 5}, eyes);
  const eR = el("rect", {x: 10, y: -100, width: 22, height: 10, rx: 5}, eyes);
  const mouth = el("rect", {x: -18, y: -68, width: 36, height: 4, rx: 2, fill: a.color, filter: "url(#glow)", class: "mouth"}, face);
  const halo = el("ellipse", {cx: 0, cy: 60, rx: 150, ry: 170, fill: a.color, opacity: 0, filter: "url(#softglow)"}, g, null);
  g.insertBefore(halo, g.firstChild);
  return {a, g, head, skull, face, eyes, eL, eR, mouth, halo, chest,
          yaw: 0, nod: 0, look: CAMERA_X, eyeX: 0, blink: 0, nextBlink: performance.now() + 1500 + Math.random() * 3000,
          nextGlance: performance.now() + 2000 + Math.random() * 4000, glanceAt: null, glanceUntil: 0, amp: 0, vote: null};
}

function drawPlate(a) {
  const k = 1 - (a.y - 382) / 600;
  const px = a.x + (a.x - 800) * 0.05, py = 598 + (a.y - 345) * 0.5;
  const g = el("g", {class: "plate", transform: `translate(${px} ${py}) rotate(${(a.x - 800) / 40})`}, document.getElementById("plates"));
  el("rect", {x: -84, y: -24, width: 168, height: 48, rx: 6, fill: "#07080f", stroke: a.color, "stroke-opacity": .55, "stroke-width": 2}, g);
  const bar = el("rect", {x: -78, y: 18, width: 156, height: 3, rx: 1.5, fill: a.color, filter: "url(#glow)", opacity: .5, class: "bar"}, g);
  el("g", {transform: "translate(-70 -11) scale(.92)", fill: "none", stroke: a.color, "stroke-width": 2, "stroke-linecap": "round",
           "stroke-linejoin": "round"}, g, a.icon);
  el("text", {x: 6, y: 8, "text-anchor": "middle", fill: a.color}, g).textContent = a.name;
  const vote = el("text", {x: 70, y: 9, "text-anchor": "middle", "font-size": 20, fill: "#fff", opacity: 0, class: "vote"}, g);
  return {g, bar, vote};
}

const R = {};
const P = {};
for (const a of AGENTS) { R[a.id] = drawRobot(a); P[a.id] = drawPlate(a); }

// ---- behaviour: who speaks, who looks at whom --------------------------------------------------------------------
let speaker = null, target = null;          // ids; target "sen" = the user, null = the table
let thinker = null;                          // the agent the local model is working for right now
let audioCtx = null, analyser = null, buf = null;

function lookX(id) {
  if (!id || id === "sen" || id === "hakem") return CAMERA_X;
  return byId[id] ? byId[id].x : CAMERA_X;
}

function frame(now) {
  let amp = 0;
  if (analyser && speaker) {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    amp = Math.min(1, Math.sqrt(s / buf.length) * 6);
  }
  for (const id in R) {
    const r = R[id], a = r.a;
    const talking = id === speaker;
    r.amp += ((talking ? amp : 0) - r.amp) * 0.35;
    // whom to look at: the speaker looks at the one it answers, the others at the speaker; idle = a glance now and then
    let want;
    if (talking) want = lookX(target);
    else if (speaker && byId[speaker]) want = byId[speaker].x;
    else if (speaker === "sen" || speaker === "hakem") want = CAMERA_X;
    else {
      if (now > r.nextGlance) {
        const others = AGENTS.filter(o => o.id !== id);
        r.glanceAt = Math.random() < 0.35 ? CAMERA_X : others[Math.floor(Math.random() * others.length)].x;
        r.glanceUntil = now + 1200 + Math.random() * 1800;
        r.nextGlance = r.glanceUntil + 2500 + Math.random() * 5000;
      }
      want = now < r.glanceUntil ? r.glanceAt : CAMERA_X;
    }
    r.look += (want - r.look) * 0.08;
    const dx = r.look - a.x;
    const yawT = Math.max(-16, Math.min(16, dx / 32));
    r.yaw += (yawT - r.yaw) * 0.12;
    const t = now / 1000;
    const nodT = talking ? Math.sin(t * 7.5) * 4 * (0.4 + r.amp) : Math.sin(t * 0.9 + a.x) * 1.2;
    r.nod += (nodT - r.nod) * 0.2;
    const breathe = Math.sin(t * 1.6 + a.x * 0.01) * 2;
    r.head.setAttribute("transform", `translate(${r.yaw * 1.4} ${breathe * 0.6}) rotate(${r.yaw * 0.9 + (talking ? Math.sin(t * 3.1) * 2 : 0)})`);
    r.skull.setAttribute("transform", `rotate(${r.nod * 0.5} 0 -40) translate(0 ${r.nod * 0.6})`);
    const ex = Math.max(-9, Math.min(9, dx / 40));
    r.eyeX += (ex - r.eyeX) * 0.15;
    if (now > r.nextBlink) { r.blink = now; r.nextBlink = now + 2200 + Math.random() * 4200; }
    r.eyes.setAttribute("opacity", id === thinker ? (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now / 180))).toFixed(2) : "1");
    const bl = now - r.blink < 140 ? 0.15 : 1;
    r.eyes.setAttribute("transform", `translate(${r.eyeX} ${-95 * (1 - bl)}) scale(1 ${bl})`);
    // the neon mouth: a thin line at rest, opens and brightens with the voice
    const open = 4 + r.amp * 13, wide = 36 - r.amp * 8;      // a neon line that opens into a rounded slot
    r.mouth.setAttribute("height", open.toFixed(1));
    r.mouth.setAttribute("rx", (open / 2).toFixed(1));
    r.mouth.setAttribute("y", (-66 - open / 2).toFixed(1));
    r.mouth.setAttribute("width", wide.toFixed(1));
    r.mouth.setAttribute("x", (-wide / 2).toFixed(1));
    r.mouth.setAttribute("opacity", (0.55 + r.amp * 0.45).toFixed(2));
    r.halo.setAttribute("opacity", (talking ? 0.10 + r.amp * 0.22 : 0).toFixed(3));
    r.g.setAttribute("transform", `translate(0 ${breathe.toFixed(2)})`);
    P[id].bar.setAttribute("opacity", talking ? (0.6 + r.amp * 0.4).toFixed(2) : "0.35");
  }
  // the microphone breathes while the user talks
  const mic = document.getElementById("mic");
  mic.querySelector(".waves").setAttribute("opacity", recording ? (0.5 + 0.5 * Math.sin(now / 160)).toFixed(2) : "0");
  mic.querySelector(".micband").setAttribute("fill", recording ? "#ff3b4e" : "#3d9bff");
  mic.querySelector(".ring").setAttribute("stroke", recording ? "#ff3b4e" : "#3d9bff");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- the line at the bottom: who says what, revealed as it is spoken ---------------------------------------------
function showLine(id, text, dur) {
  const p = byId[id] || (id === "hakem" ? HAKEM : USER);
  const who = document.getElementById("who");
  who.style.color = p.color;
  who.innerHTML = `${p.name}<small>${p.role}</small>`;
  const box = document.getElementById("text");
  const t0 = performance.now();
  const step = () => {
    const k = dur ? Math.min(1, (performance.now() - t0) / (dur * 1000)) : 1;
    const n = Math.round(text.length * k);
    box.innerHTML = "";
    box.append(document.createTextNode(text.slice(0, n)));
    const rest = document.createElement("span"); rest.className = "rest"; rest.textContent = text.slice(n);
    box.append(rest);
    if (k < 1 && box.dataset.line === String(t0)) requestAnimationFrame(step);
  };
  box.dataset.line = String(t0);
  step();
}

function setVote(id, vote) {
  const v = P[id].vote;
  v.textContent = vote === "destek" ? "👍" : vote === "itiraz" ? "👎" : vote === "cekimser" ? "·" : "";
  v.setAttribute("opacity", vote ? 1 : 0);
}

// ---- playing a line ------------------------------------------------------------------------------------------
const player = new Audio();
function speak(item) {
  return new Promise(resolve => {
    speaker = item.who; target = item.to || null;
    document.getElementById("phase").textContent = item.phase || "";
    if (item.votes) for (const k in item.votes) setVote(k, item.votes[k]);
    if (item.clearVotes) for (const a of AGENTS) setVote(a.id, null);
    const done = () => { speaker = null; target = null; setTimeout(resolve, item.pause ?? 450); };
    if (!item.audio) { showLine(item.who, item.text, 0); setTimeout(done, item.who === "sen" ? 1200 : 1800 + Math.min(item.text.length, 80) * 30); return; }
    player.src = item.audio;
    player.onloadedmetadata = () => showLine(item.who, item.text, player.duration);
    player.onended = done;
    player.onerror = () => { showLine(item.who, item.text, 0); setTimeout(done, 2500); };
    player.play().catch(() => { showLine(item.who, item.text, 0); setTimeout(done, 2500); });
  });
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaElementSource(player);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  buf = new Float32Array(analyser.fftSize);
  src.connect(analyser); analyser.connect(audioCtx.destination);
  applyOutput();
}

// ---- audio devices: which microphone to talk into, which speaker/headphones to hear the board on --------------------
const DEV = {mic: "", out: ""};
try { Object.assign(DEV, JSON.parse(localStorage.getItem("kurul_aygit") || "{}")); } catch (e) {}
function saveDev() { try { localStorage.setItem("kurul_aygit", JSON.stringify(DEV)); } catch (e) {} }
function micConstraint() { return DEV.mic ? {deviceId: {exact: DEV.mic}} : true; }
async function applyOutput() {
  const note = document.getElementById("devnote");
  try {
    if (audioCtx && audioCtx.setSinkId) await audioCtx.setSinkId(DEV.out || "");
    else if (player.setSinkId) await player.setSinkId(DEV.out || "");
    else note.textContent = "Bu tarayıcı çıkış aygıtı seçmeye izin vermiyor; Windows'un varsayılan aygıtı kullanılıyor.";
  } catch (e) { note.textContent = "Çıkış aygıtı seçilemedi: " + e.message; }
}
async function listDevices() {
  let devs = await navigator.mediaDevices.enumerateDevices();
  if (!devs.some(d => d.label)) {     // names are hidden until the microphone is allowed once
    try { (await navigator.mediaDevices.getUserMedia({audio: true})).getTracks().forEach(t => t.stop()); } catch (e) {}
    devs = await navigator.mediaDevices.enumerateDevices();
  }
  const fill = (sel, kind, cur) => {
    const list = devs.filter(d => d.kind === kind);
    sel.innerHTML = `<option value="">Windows varsayılanı</option>` + list.map((d, i) =>
      `<option value="${d.deviceId}">${(d.label || (kind === "audioinput" ? "Mikrofon " : "Çıkış ") + (i + 1)).replace(/</g, "&lt;")}</option>`).join("");
    sel.value = list.some(d => d.deviceId === cur) ? cur : "";
  };
  fill(document.getElementById("micsel"), "audioinput", DEV.mic);
  fill(document.getElementById("outsel"), "audiooutput", DEV.out);
  if (!devs.some(d => d.kind === "audiooutput"))
    document.getElementById("devnote").textContent = "Çıkış aygıtları listelenemedi; Windows'un varsayılanı kullanılıyor.";
}
let meter = null;
async function startMeter() {
  stopMeter();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: micConstraint()});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(stream).connect(an);
    const b = new Float32Array(an.fftSize), bar = document.querySelector("#miclevel i");
    const tick = () => { an.getFloatTimeDomainData(b); let m = 0; for (const v of b) m = Math.max(m, Math.abs(v));
                         bar.style.width = Math.min(100, m * 160) + "%"; if (meter) meter.raf = requestAnimationFrame(tick); };
    meter = {stream, ctx, raf: requestAnimationFrame(tick)};
  } catch (e) { document.getElementById("devnote").textContent = "Mikrofon açılamadı: " + e.message; }
}
function stopMeter() {
  if (!meter) return;
  cancelAnimationFrame(meter.raf); meter.stream.getTracks().forEach(t => t.stop()); meter.ctx.close(); meter = null;
  document.querySelector("#miclevel i").style.width = "0";
}
document.getElementById("dbtn").addEventListener("click", async () => {
  const pan = document.getElementById("devpanel"), b = document.getElementById("dbtn");
  pan.hidden = !pan.hidden; b.setAttribute("aria-expanded", String(!pan.hidden));
  if (pan.hidden) { stopMeter(); return; }
  await listDevices(); startMeter();
});
document.getElementById("micsel").addEventListener("change", e => { DEV.mic = e.target.value; saveDev(); startMeter(); });
document.getElementById("outsel").addEventListener("change", e => { DEV.out = e.target.value; saveDev(); applyOutput(); });
document.getElementById("outtest").addEventListener("click", async () => {
  initAudio();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 660; g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.65);
});
navigator.mediaDevices && navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener("devicechange", () => {
  if (!document.getElementById("devpanel").hidden) listDevices();
});

// ---- the microphone (press to talk). The recording goes only to this computer's Kurgu Masası server. ------------
let recording = false, rec = null, chunks = [];
async function toggleMic() {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: micConstraint()});
      rec = new MediaRecorder(stream); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); onUserAudio(new Blob(chunks, {type: rec.mimeType})); };
      rec.start(); recording = true;
      showLine("sen", "Dinliyorum… bitince mikrofona tekrar bas.", 0);
    } catch (e) { showLine("sen", "Mikrofona erişilemedi: " + e.message, 0); }
  } else { recording = false; rec.stop(); }
}
async function onUserAudio(blob) {
  if (!LIVE) { showLine("sen", "Bu bir tekrar gösterimi: mikrofonla konuşma canlı toplantıda çalışacak.", 0); return; }
  showLine("sen", "Yazıya çevriliyor…", 0);
  const j = await (await fetch("/api/kurul/soz", {method: "POST", body: blob})).json();
  if (j.hata || j.metin === "(anlaşılamadı)") showLine("sen", j.hata || "Anlayamadım, bir daha söyler misin?", 0);
  // a recognised sentence comes back as an event, so the board answers it in order
}
const micEl = document.getElementById("mic");
micEl.addEventListener("click", toggleMic);
micEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleMic(); } });

// ---- source: a recorded meeting (?demo=file.json) or the live meeting (later) --------------------------------
const params = new URLSearchParams(location.search);
const LIVE = !params.get("demo");
const AUTO = params.get("oto") === "1";
async function runDemo(url) {
  const script = await (await fetch(url)).json();
  document.getElementById("proj").textContent = script.proje || "";
  const from = parseInt(params.get("from") || "0", 10);
  for (const item of script.akis.slice(from)) await speak(item.audio ? {...item, audio: new URL(item.audio, new URL(url, location.href)).href} : item);
  document.getElementById("phase").textContent = "toplantı bitti";
}
const queueEv = [];
let lastId = -1, playing = false;
async function poll() {
  try {
    const j = await (await fetch(`/api/kurul/olaylar?after=${lastId}`)).json();
    for (const e of j.events) { lastId = Math.max(lastId, e.id); queueEv.push(e); }
    thinker = j.dusunen && byId[j.dusunen] ? j.dusunen : null;
    if ((j.durum === "bitti" || j.durum === "kapandı") && !panelShownOnce && !queueEv.length && !playing) {
      panelShownOnce = true; togglePanel(true);                  // the meeting is over: the decisions come up by themselves
    }
    const st = {"model yükleniyor": "dil modeli yükleniyor…", "ölçülüyor": "video ölçülüyor", "görüşler": "görüşler", "oylama": "oylama", "tartışma": "tartışma",
                "kararlar": "kararlar", "bitti": "soru-cevap", "kapandı": "toplantı kapandı", "hata": "hata: " + (j.hata || "")}[j.durum] || j.durum;
    if (!speaker) document.getElementById("phase").textContent = thinker ? `${byId[thinker].name} düşünüyor…` : st;
    if (!playing && queueEv.length) playQueue();
  } catch (e) { document.getElementById("phase").textContent = "oda sunucusuna ulaşılamıyor"; }
  setTimeout(poll, 700);
}
async function playQueue() {
  playing = true;
  while (queueEv.length) {
    const e = queueEv.shift();
    if (e.soru === "profil") { loadProfile(); document.getElementById("profbox").classList.add("ask"); }
    await speak(e.audio ? {...e, audio: "/ses/" + e.audio} : e);
  }
  playing = false;
}
async function startLive() {
  const err = document.getElementById("err");
  const j = await (await fetch("/api/kurul/projeler")).json();
  const sel = document.getElementById("proj-sel");
  for (const p of j.projeler) {
    const o = document.createElement("option"); o.value = p.ad; o.textContent = `${p.baslik} (${p.sure_dk} dk)`; sel.append(o);
  }
  if (j.proje) sel.value = j.proje;
  document.getElementById("pick").hidden = !j.projeler.length;
  if (!j.projeler.length) err.textContent = "Henüz videosu hazır bir proje yok. Önce Kurgu Masası'nda bir video oluştur.";
  else if (j.is) err.textContent = `Şu an bir video işi çalışıyor (${j.is}); toplantı iş bitince başlayabilir.`;
  document.getElementById("go").textContent = "Toplantıyı başlat";
  document.getElementById("startnote").textContent = "Ajanlar senin bilgisayarındaki dil modeliyle düşünür; her cümle birkaç saniye sürer.";
}
document.getElementById("go").addEventListener("click", async () => {
  initAudio();
  if (AUTO) { audioCtx.resume(); enterLive(); return; }      // joining a meeting that started by itself
  if (!LIVE) { document.getElementById("start").remove(); runDemo(params.get("demo")); return; }
  const name = document.getElementById("proj-sel").value;
  const r = await (await fetch("/api/kurul/baslat", {method: "POST", body: JSON.stringify({proje: name})})).json();
  if (r.hata && !/sürüyor/.test(r.hata)) { document.getElementById("err").textContent = r.hata; return; }
  document.getElementById("proj").textContent = document.getElementById("proj-sel").selectedOptions[0]?.textContent || name;
  document.getElementById("start").remove();
  document.getElementById("typebox").hidden = false;
  poll();
});
document.getElementById("typebox").addEventListener("submit", async e => {
  e.preventDefault();
  const inp = document.getElementById("typein"), metin = inp.value.trim();
  if (!metin) return;
  inp.value = "";
  await fetch("/api/kurul/yaz", {method: "POST", body: JSON.stringify({metin})});
});
async function joinRunning() {           // the window was opened for a meeting that already started by itself
  initAudio();
  if (audioCtx.state !== "running") { try { await audioCtx.resume(); } catch (e) {} }
  if (audioCtx.state !== "running") {     // the browser wants one click before sound
    document.getElementById("go").textContent = "Toplantıya katıl";
    document.getElementById("startnote").textContent = "Kurul toplandı. Sesleri duyabilmen için bir kez tıkla.";
    return;
  }
  enterLive();
}
// ---- the decisions panel: explicit approve / reject, preview, apply, undo (nothing happens without a click) ----------
let panelShownOnce = false;
async function loadPanel() {
  const panel = document.getElementById("panel");
  const j = await (await fetch("/api/kurul/kararlar")).json();
  const name = n => (AGENTS.find(a => a.id === n) || {name: n}).name;
  panel.innerHTML = `<h2>Kurulun kararları</h2><div class="meta">Hiçbiri sen onaylamadan uygulanmaz. Uygulanabilenler yalnızca
    proje ayarını değiştirir; şimdiki videoya dokunulmaz.</div>` + (j.kararlar.length ? "" : "<p class='meta'>Henüz karar yok.</p>");
  for (const k of j.kararlar) {
    const div = document.createElement("div"); div.className = "item";
    const status = k.kullanici === "onay" ? "<span class='ok'>✓ onayladın</span>" : k.kullanici === "ret" ? "<span class='no'>✗ reddettin</span>" : "onay bekliyor";
    div.innerHTML = `<b></b><div class="meta">${name(k.ajan)} · ${k.destek}/6 destek · ${status}</div><div class="acts"></div><div class="note"></div>`;
    div.querySelector("b").textContent = k.baslik;
    const acts = div.querySelector(".acts"), note = div.querySelector(".note");
    note.textContent = k.uygulandi ? "Uygulandı; geri alabilirsin." : (k.uygulanabilir ? "" : (k.neden || ""));
    const btn = (label, fn, on = true) => { const b = document.createElement("button"); b.textContent = label; b.disabled = !on; b.onclick = fn; acts.append(b); };
    const post = async (path, body) => (await fetch(path, {method: "POST", body: JSON.stringify(body)})).json();
    btn("✓ Onayla", async () => { await post("/api/kurul/karar", {id: k.id, karar: "onay"}); loadPanel(); }, k.kullanici !== "onay");
    btn("✗ Reddet", async () => { await post("/api/kurul/karar", {id: k.id, karar: "ret"}); loadPanel(); }, k.kullanici !== "ret");
    btn("Önizle", async () => { const r = await post("/api/kurul/onizle", {id: k.id});
      note.textContent = r.degisiklik ? r.degisiklik.map(c => `${c.alan}: ${c.once} → ${c.sonra}`).join("; ") + ". " + (r.not || "") : (r.neden || ""); },
      k.uygulanabilir);
    btn("Uygula", async () => { const r = await post("/api/kurul/uygula", {id: k.id}); note.textContent = r.tamam ? "Uygulandı ve doğrulandı." : (r.neden || "Uygulanamadı."); loadPanel(); },
      k.uygulanabilir && k.kullanici === "onay" && !k.uygulandi);
    btn("Geri al", async () => { const r = await post("/api/kurul/geri_al", {geri_al: k.uygulandi}); note.textContent = r.tamam ? "Geri alındı." : (r.neden || ""); loadPanel(); },
      !!k.uygulandi);
    panel.append(div);
  }
}
function togglePanel(show) {
  const panel = document.getElementById("panel"), b = document.getElementById("kbtn");
  panel.hidden = show === undefined ? !panel.hidden : !show;
  b.setAttribute("aria-expanded", String(!panel.hidden));
  if (!panel.hidden) loadPanel();
}
document.getElementById("kbtn").addEventListener("click", () => togglePanel());

// ---- what kind of video (the chair asks when its guess is weak) -------------------------------------------------
async function loadProfile() {
  const j = await (await fetch("/api/kurul/profil")).json();
  const sel = document.getElementById("profsel");
  sel.innerHTML = "";
  for (const [k, ad] of Object.entries(j.profiller)) { const o = document.createElement("option"); o.value = k; o.textContent = ad; sel.append(o); }
  if (j.profil) {
    sel.value = j.profil.profil;
    sel.title = j.profil.kaynak === "kullanici" ? "senin seçimin" : `tahmin, güven %${Math.round(100 * (j.profil.guven || 0))}`;
  }
  document.getElementById("profbox").hidden = false;
}
document.getElementById("profsel").addEventListener("change", async e => {
  await fetch("/api/kurul/profil", {method: "POST", body: JSON.stringify({profil: e.target.value})});
  document.getElementById("profbox").classList.remove("ask");
});

function enterLive() {
  document.getElementById("start")?.remove();
  document.getElementById("typebox").hidden = false;
  document.getElementById("kbtn").hidden = false;
  loadProfile();
  fetch("/api/kurul/projeler").then(r => r.json()).then(j => { document.getElementById("proj").textContent = j.proje || ""; });
  poll();
}
if (LIVE && AUTO) joinRunning(); else if (LIVE) startLive();
if (!LIVE) document.getElementById("startnote").textContent = "Bu, Dertleşme toplantısının tekrar gösterimi. Sesleri duyabilmen için bir kez tıklaman gerekiyor.";
</script>
